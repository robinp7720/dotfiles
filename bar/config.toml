primary_output = "DP-3"

[thresholds]
calendar_soon_minutes = 15
timer_soon_minutes = 5
battery_low_percent = 15
battery_critical_percent = 7
work_completed_seconds = 30
critical_snooze_seconds = 300

[modules]
full = [
  "workspaces",
  "focused_app",
  "focused_title",
  "context",
  "ai_usage",
  "network",
  "bluetooth",
  "bluetooth_audio",
  "power",
  "notifications",
  "clock",
]
reduced = ["workspaces", "focused_title", "critical_warning", "clock"]

[freshness]
compositor_seconds = 10
resources_seconds = 15
ai_usage_seconds = 45
power_seconds = 30
network_seconds = 30
brightness_seconds = 10
bluetooth_seconds = 30
media_seconds = 15
calendar_seconds = 60
activity_seconds = 45
timers_seconds = 5

[retry_backoff]
compositor_seconds = 2
power_seconds = 8
network_seconds = 8
brightness_seconds = 5
bluetooth_seconds = 8
media_seconds = 8
calendar_seconds = 30
activity_seconds = 5

[experience]
motion = "calm"
ambient_motion = "meaningful"
suggestions = true

[routines]
enabled = true
context = "rich"
minimum_repetitions = 3
retention_days = 30

[notifications]
enabled = true
history_days = 7
history_limit = 100
visible_limit = 3
dnd_queue_limit = 20
preview_seconds = 8
low_timeout_seconds = 10
normal_timeout_seconds = 30
sound = true

[[command_activity.allowlist]]
label = "Cargo build"
prefixes = ["cargo build"]

[[command_activity.allowlist]]
label = "Cargo test"
prefixes = ["cargo test"]

[[command_activity.allowlist]]
label = "Cargo run"
prefixes = ["cargo run"]

[[command_activity.allowlist]]
label = "npm test"
prefixes = ["npm test"]

[[command_activity.allowlist]]
label = "pnpm test"
prefixes = ["pnpm test"]

[[command_activity.allowlist]]
label = "Pytest"
prefixes = ["pytest"]

[[command_activity.allowlist]]
label = "Make"
prefixes = ["make"]

# Native clipping and layer-shell geometry; GTK appearance lives in style.css.
# Restart Vigil after changing these values.
[style]
surface_margin = 0
bar_padding = 0
panel_margin = 0
panel_bottom_margin = 0
panel_radius = 0
card_radius = 0
context_radius = 0
shadows = false
