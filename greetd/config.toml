[terminal]
# The VT to run the greeter on. Can be "next", "current" or a number designating the VT.
vt = 1

# The default session, also known as the greeter.
[default_session]
# The native shell greeter runs in its own minimal Hyprland session.
command = "start-hyprland -- --config /etc/shell-greeter/hyprland.lua"
user = "greeter"
