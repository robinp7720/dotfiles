[package]
name = "shell-greeter"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
async-channel = "2"
clap = { version = "4", features = ["derive"] }
gtk4 = { version = "0.10.3", features = ["v4_20"] }
gtk4-layer-shell = "0.7"
greetd_ipc = { version = "0.10.3", features = ["sync-codec"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
