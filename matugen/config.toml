[config]

[templates.hyprland]
input_path = '~/.config/matugen/templates/hyprland-colors.lua'
output_path = '~/.config/hypr/colors.lua'
post_hook = 'hyprctl reload || true'

[templates.hyprlock]
input_path = '~/.config/matugen/templates/hyprlock-colors.conf'
output_path = '~/.config/hypr/hyprlock-colors.conf'

[templates.kitty]
input_path = '~/.config/matugen/templates/kitty.conf'
output_path = '~/.config/kitty/colors.conf'
post_hook = 'pkill -USR1 -x kitty'

[templates.niri]
input_path = '~/.config/matugen/templates/niri-colors.kdl'
output_path = '~/.config/niri/colors.kdl'

[templates.greetd]
input_path = '~/.config/matugen/templates/greetd.css'
output_path = '/var/cache/matugen/greetd.css'

[templates.luma]
input_path = '~/.config/matugen/templates/luma.css'
output_path = '~/.config/Luma/theme.css'

[templates.bar]
input_path = '~/.config/matugen/templates/bar-colors.css'
output_path = '~/.config/vigil/colors.css'
post_hook = 'pkill -HUP -x vigil || true'

[templates.tv_mode]
input_path = '~/.config/matugen/templates/tv-mode.css'
output_path = '~/.config/tv-mode/colors.css'

[templates.refind]
input_path = '~/.config/matugen/templates/refind.json'
output_path = '/var/cache/matugen/refind-colors.json'
#post_hook = '~/.dotfiles/scripts/refind-matugen.sh /var/cache/matugen/refind-colors.json'
