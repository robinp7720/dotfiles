source = ~/.config/hypr/hyprlock-colors.conf

background {
    monitor =
    path = screenshot
    blur_passes = 5
    contrast = 1.05
    brightness = 0.78
    vibrancy = 0.25
    vibrancy_darkness = 0.2
}

general {
    hide_cursor = true
    ignore_empty_input = true
    text_trim = true
}

# Date and time remain as the quiet ambient surface on every output.
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %-d"
    color = $foreground_dim
    font_size = 20
    font_family = Cantarell
    position = 0, 280
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME12
    color = $accent
    font_size = 98
    font_family = Cantarell ExtraBold
    position = 0, 185
    halign = center
    valign = center
}

# The remaining widgets form one card-free vertical stack on the output that
# was focused when locking began. A direct hyprlock invocation mirrors them.
image {
    monitor = # @dashboard-monitor@
    path = ~/.face
    size = 112
    border_size = 3
    border_color = $accent
    position = 0, 52
    halign = center
    valign = center
}

label {
    monitor = # @dashboard-monitor@
    text = Enter password to unlock
    color = $foreground_dim
    font_size = 16
    font_family = Cantarell
    position = 0, -40
    halign = center
    valign = center
}

input-field {
    monitor = # @dashboard-monitor@
    size = 320, 62
    outline_thickness = 2
    dots_size = 0.18
    dots_spacing = 0.3
    dots_center = true
    outer_color = $accent
    inner_color = rgba(00000052)
    font_color = $foreground
    font_family = Cantarell
    fade_on_empty = false
    rounding = 14
    check_color = $accent_alt
    fail_color = $lock_error
    capslock_color = $accent_alt
    placeholder_text = <span foreground="##c2c8bd">$PAMPROMPT</span>
    fail_text = <span foreground="##ffb4ab">$PAMFAIL ($ATTEMPTS)</span>
    hide_input = false
    position = 0, -110
    halign = center
    valign = center
}

label {
    monitor = # @dashboard-monitor@
    text = cmd[update:60000] ~/.dotfiles/scripts/next_event.sh --blank-when-empty
    color = $foreground
    font_size = 15
    font_family = Cantarell
    position = 0, -190
    halign = center
    valign = center
}

label {
    monitor = # @dashboard-monitor@
    text = cmd[update:1000] ~/.dotfiles/scripts/lockscreen_context.sh timer
    color = $accent_alt
    font_size = 14
    font_family = Cantarell ExtraBold
    position = 0, -230
    halign = center
    valign = center
}

label {
    monitor = # @dashboard-monitor@
    text = cmd[update:5000] ~/.dotfiles/scripts/lockscreen_context.sh summary
    color = $foreground_dim
    font_size = 12
    font_family = Cantarell
    position = 0, -270
    halign = center
    valign = center
}

image {
    monitor = # @dashboard-monitor@
    path = ~/.cache/hyprlock/album.jpg
    size = 132
    border_size = 2
    border_color = $accent
    rounding = 14
    position = 0, 126
    reload_time = 2
    halign = center
    valign = bottom
}

label {
    monitor = # @dashboard-monitor@
    text = cmd[update:1000] ~/.dotfiles/scripts/now_playing.sh
    color = $foreground
    font_size = 18
    font_family = Cantarell
    position = 0, 48
    halign = center
    valign = bottom
}

label {
    monitor = # @dashboard-monitor@
    text = ⏮
    color = $foreground_dim
    font_size = 20
    font_family = Cantarell
    position = -54, 14
    halign = center
    valign = bottom
    onclick = ~/.dotfiles/scripts/now_playing.sh --previous
}

label {
    monitor = # @dashboard-monitor@
    text = ⏯
    color = $accent
    font_size = 22
    font_family = Cantarell
    position = 0, 14
    halign = center
    valign = bottom
    onclick = ~/.dotfiles/scripts/now_playing.sh --toggle
}

label {
    monitor = # @dashboard-monitor@
    text = ⏭
    color = $foreground_dim
    font_size = 20
    font_family = Cantarell
    position = 54, 14
    halign = center
    valign = bottom
    onclick = ~/.dotfiles/scripts/now_playing.sh --next
}
