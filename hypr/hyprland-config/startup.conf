env = SSH_AUTH_SOCK,$XDG_RUNTIME_DIR/gcr/ssh

# See https://wiki.hyprland.org/Configuring/Monitors/
source = ~/.config/hypr/monitors.conf

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = dbus-update-activation-environment --systemd HYPRLAND_INSTANCE_SIGNATURE
exec-once = dbus-update-activation-environment --all
exec-once = systemctl --user restart vigil.service
exec-once = systemctl --user restart awww-daemon.service awww-wallpaper.service

#exec-once = hyprpm reload -n
exec-once = systemctl --user restart hypridle.service

# Execute your favorite apps at launch
exec-once = ~/.dotfiles/scripts/album_art_watcher.sh &
exec-once = setsid -f ~/.dotfiles/scripts/center_tws_login.sh
exec-once = firefox
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = /usr/bin/kdeconnectd
exec-once = /usr/bin/hyprsunset
exec-once = ~/.dotfiles/scripts/start_codex_self_improve_service.sh
