general {
    lock_cmd = ~/.dotfiles/scripts/session_lock.sh
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = ~/.dotfiles/scripts/session_display.sh on
    inhibit_sleep = 3
}

listener {
    timeout = 150                                # 2.5min.
    on-timeout = brightnessctl -s set 10         # set monitor backlight to minimum, avoid 0 on OLED monitor.
    on-resume = brightnessctl -r                 # monitor backlight restor.
}

# turn off keyboard backlight, uncomment this section if have keyboard backlight.
listener { 
    timeout = 150                                          # 2.5min.
    on-timeout = brightnessctl -sd rgb:kbd_backlight set 0 # turn off keyboard backlight.
    on-resume = brightnessctl -rd rgb:kbd_backlight        # turn on keyboard backlight.
}

listener {
    timeout = 270                                 # 4.5min, 30s before the lock below
    on-timeout = vigil osd lock-countdown --seconds 30
    on-resume = vigil osd hide
}

listener {
    timeout = 300                                 # 5min
    on-timeout = loginctl lock-session            # lock screen when timeout has passed
}

listener {
    timeout = 380                                 # 6min 20sec
    on-timeout = ~/.dotfiles/scripts/session_display.sh off
    on-resume = ~/.dotfiles/scripts/session_display.sh on
}

listener {
    timeout = 1800                                # 30min
    on-timeout = systemctl suspend                # suspend pc
}
