output = "Unknown-2"
workspace = "tv"

[oblecto]
server = "https://oblecto.home.robindecker.me"

[modes]
home = "3840x2160@60.0"
gaming = "1920x1080@119.88"
media = "3840x2160@30.0"
scale = 1.0

[audio]
card = "alsa_card.pci-0000_05_00.1"
tv_profile = "output:hdmi-stereo-extra2"
tv_sink = "alsa_output.pci-0000_05_00.1.hdmi-stereo-extra2"

[apps.steam]
program = "steam"
args = ["steam://open/bigpicture"]

[apps.kodi]
program = "/usr/bin/kodi"
args = ["-fs", "--windowing=wayland"]

[power]
home = "balanced"
gaming = "performance"
media = "balanced"
