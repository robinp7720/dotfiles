output = "HDMI-A-2"
workspace = "tv"

[modes]
home = "3840x2160@60.0"
gaming = "1920x1080@119.88"
media = "3840x2160@60.0"
scale = 1.0

[audio]
card = "alsa_card.pci-0000_06_00.1"
tv_profile = "output:hdmi-stereo"
tv_sink = "alsa_output.pci-0000_06_00.1.hdmi-stereo"

[apps.steam]
program = "steam"
args = ["steam://open/bigpicture"]

[apps.jellyfin]
program = "/home/robin/.local/bin/jellyfin-desktop"
args = ["--fullscreen", "--tv"]

[power]
home = "balanced"
gaming = "performance"
media = "balanced"
